{% extends "base.html" %}

{% block title %}{{ t('login_title') }} - {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="container">
    <h2>{{ t('login_title') }}</h2>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if request.args.get('next') %}<input type="hidden" name="next" value="{{ request.args.get('next') }}">{% endif %}
        <div class="form-group">
            <label for="identifier">{{ t('username_or_email') }}:</label>
            <input type="text" id="identifier" name="identifier" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">{{ t('password') }}:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit">{{ t('login') }}</button>
    </form>
    
    <div class="footer-link">
        {{ t('no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('register') }}</a>
    </div>
</div>
{% endblock %}
